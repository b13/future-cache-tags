name: CI

on:
  push:
  pull_request:
  schedule:
    - cron:  '56 5 * * *'

jobs:

  # runTests.sh prefers podman, which runs rootless on GitHub runners and can not resolve
  # the database container by name. Docker is used instead.
  testsuite:
    name: all tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.2', '8.5' ]
        TYPO3: [ '13', '14' ]
        include:
          - php: '8.5'
            TYPO3: '15'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install testing system
        run: Build/Scripts/runTests.sh -b docker -p ${{ matrix.php }} -t ${{ matrix.TYPO3 }} -s composerInstall

      - name: Composer validate
        run: Build/Scripts/runTests.sh -b docker -p ${{ matrix.php }} -t ${{ matrix.TYPO3 }} -s composerValidate

      - name: Lint PHP
        run: Build/Scripts/runTests.sh -b docker -p ${{ matrix.php }} -s lint

      - name: CGL
        run: Build/Scripts/runTests.sh -b docker -p ${{ matrix.php }} -s cgl -n

      - name: phpstan
        run: Build/Scripts/runTests.sh -b docker -p ${{ matrix.php }} -t ${{ matrix.TYPO3 }} -s phpstan

      - name: Unit Tests
        run: Build/Scripts/runTests.sh -b docker -p ${{ matrix.php }} -s unit

      - name: Functional Tests with mariadb
        run: Build/Scripts/runTests.sh -b docker -p ${{ matrix.php }} -s functional

      - name: Functional Tests with postgres
        run: Build/Scripts/runTests.sh -b docker -p ${{ matrix.php }} -s functional -d postgres -i 16

      - name: Functional Tests with sqlite
        run: Build/Scripts/runTests.sh -b docker -p ${{ matrix.php }} -s functional -d sqlite

  # typo3/cms-workspaces is optional: RecordPublishedListener listens to
  # AfterRecordPublishedEvent of EXT:workspaces. The event class is only named
  # in the attribute and the parameter type, which are resolved lazily, so the
  # container must still compile without EXT:workspaces. Verified, not assumed.
  without-workspaces:
    name: tests without EXT:workspaces
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install testing system without EXT:workspaces
        run: |
          Build/Scripts/runTests.sh -b docker -p 8.5 -s composer remove typo3/cms-workspaces --dev --no-update --no-interaction
          Build/Scripts/runTests.sh -b docker -p 8.5 -s composer update --no-progress --no-interaction

      - name: Assert the event class is really absent
        run: test ! -d .Build/vendor/typo3/cms-workspaces

      - name: Functional Tests that do not need EXT:workspaces
        run: Build/Scripts/runTests.sh -b docker -p 8.5 -s functional -d sqlite -- --exclude-group workspaces
